name: Bug report
description: Something on the site is broken
labels: [bug]
body:
  - type: input
    id: url
    attributes: {label: Page URL, placeholder: "https://cyphermonkeylabs.com/python-lab-free-university-mesmerizing/#/..."}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened and what did you expect?}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Browser, device and theme, description: "For example Safari on iPhone, contrast theme"}
