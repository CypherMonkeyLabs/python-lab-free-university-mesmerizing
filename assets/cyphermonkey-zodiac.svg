<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="CypherMonkey zodiac monkey symbol">
  <defs>
    <radialGradient id="cmz-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="cmz-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cmz-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cmz-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <!-- Cosmic Zodiac Wheel -->
  <circle cx="60" cy="60" r="56" fill="url(#cmz-bg)" stroke="url(#cmz-ring)" stroke-width="3.5"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 5" opacity="0.75"/>
  <circle cx="60" cy="60" r="43" fill="none" stroke="#22d3ee" stroke-width="0.9" opacity="0.45"/>
  <!-- 12 Zodiac Constellation Nodes -->
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="60" cy="7.5" r="2"/><circle cx="86.2" cy="14.5" r="1.6"/><circle cx="105.5" cy="33.8" r="1.6"/>
    <circle cx="112.5" cy="60" r="2"/><circle cx="105.5" cy="86.2" r="1.6"/><circle cx="86.2" cy="105.5" r="1.6"/>
    <circle cx="60" cy="112.5" r="2"/><circle cx="33.8" cy="105.5" r="1.6"/><circle cx="14.5" cy="86.2" r="1.6"/>
    <circle cx="7.5" cy="60" r="2"/><circle cx="14.5" cy="33.8" r="1.6"/><circle cx="33.8" cy="14.5" r="1.6"/>
  </g>
  <!-- Sacred Geometry Triangle Hint -->
  <polygon points="60,12 102,84 18,84" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
  <!-- Monkey Ears -->
  <circle cx="25" cy="58" r="13" fill="url(#cmz-fur)" stroke="#92400e" stroke-width="2"/>
  <circle cx="25" cy="58" r="7" fill="#fb7185"/>
  <circle cx="95" cy="58" r="13" fill="url(#cmz-fur)" stroke="#92400e" stroke-width="2"/>
  <circle cx="95" cy="58" r="7" fill="#fb7185"/>
  <!-- Monkey Head -->
  <circle cx="60" cy="60" r="31" fill="url(#cmz-fur)" stroke="#92400e" stroke-width="2.2"/>
  <!-- Forehead Zodiac Star / Flame Crest -->
  <path d="M60 22 L63.5 31 L73 31.8 L65.5 37.8 L68 47 L60 41.5 L52 47 L54.5 37.8 L47 31.8 L56.5 31 Z" fill="#fde047" stroke="#b45309" stroke-width="1.3" stroke-linejoin="round"/>
  <circle cx="60" cy="35.5" r="2.6" fill="#f472b6"/>
  <!-- Muzzle -->
  <ellipse cx="60" cy="72" rx="20" ry="14" fill="url(#cmz-face)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="48" cy="56" r="7.5" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
  <circle cx="72" cy="56" r="7.5" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
  <circle cx="49" cy="56.5" r="4" fill="#0f172a"/>
  <circle cx="73" cy="56.5" r="4" fill="#0f172a"/>
  <circle cx="47.2" cy="54.5" r="1.6" fill="#fff"/>
  <circle cx="71.2" cy="54.5" r="1.6" fill="#fff"/>
  <!-- Cyber Zodiac Glasses -->
  <circle cx="48" cy="56" r="11" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
  <circle cx="72" cy="56" r="11" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
  <path d="M59 56 H61" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Nose & Smile -->
  <ellipse cx="60" cy="68" rx="4.2" ry="2.8" fill="#78350f"/>
  <path d="M50 75 Q60 83 70 75" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="42" cy="72" r="3.2" fill="#f472b6" opacity="0.65"/>
  <circle cx="78" cy="72" r="3.2" fill="#f472b6" opacity="0.65"/>
</svg>
